name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job gets only what it needs; the deploy token never reaches the build,
# where third-party packages run.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      # Actions are pinned to commit SHAs (same pins as laion.ai) so a moved tag cannot change what runs.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate
        run: bun run format:check && bun run check
      # Pages reports where the site lives (now roar.laion.ai at the root). The build adapts
      # without code changes.
      - name: Build
        run: bun run build
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      # The LaTeX author kit is zipped from author-kit/ on every deploy, so the download always
      # matches the source in the repository.
      - name: Package author kit
        run: |
          mkdir -p dist/downloads
          cd author-kit
          zip -r -X -q ../dist/downloads/roar2027-author-kit.zip \
            roar2027.cls paper.tex references.bib data Makefile build.sh README.md AGENTS.md
          unzip -l ../dist/downloads/roar2027-author-kit.zip
      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
